[project]
name = "behaviorlens-backend"
version = "0.2.0"
description = "BehaviorLens API and background worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "celery[redis]==5.6.3",
  "boto3==1.43.123",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx==0.28.1",
  "ruff==0.17.3",
  "pyright==1.1.414",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
