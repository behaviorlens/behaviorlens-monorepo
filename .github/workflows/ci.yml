name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Forbidden content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-forbidden.mjs

  web:
    name: Web, demo site and recorder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace frontend
      - run: npm test --workspaces --if-present
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: behaviorlens
          POSTGRES_PASSWORD: behaviorlens
          POSTGRES_DB: behaviorlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U behaviorlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      BL_DATABASE_URL: postgresql+psycopg://behaviorlens:behaviorlens@localhost:5432/behaviorlens
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest
      - name: Migrations apply to an empty database and match the models
        run: |
          alembic upgrade head
          alembic check
          python -m app.seed

  api-contract:
    name: API schema is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: pip install -e "backend[dev]"
      - run: npm run generate:api
        env:
          BL_PYTHON: python
      - name: Fail if the committed schema differs
        run: git diff --exit-code backend/openapi.json frontend/src/api/schema.d.ts

  e2e:
    name: End to end (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API, the recorder bundle and both front ends
        run: |
          for url in http://localhost:8000/health http://localhost:8000/recorder/bl.js http://localhost:5173/app http://localhost:5174/; do
            for i in $(seq 1 90); do
              curl -sf -o /dev/null "$url" && break
              sleep 2
            done
            curl -sf -o /dev/null "$url" || { echo "$url never came up"; exit 1; }
          done
      - name: Recording, parity and privacy tests
        run: npm run test:e2e
      - name: Short ingest load test
        run: npm run load:ingest -- 20 30
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200
